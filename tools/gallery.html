<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sigenergy TC example gallery</title>
<style>html,body{margin:0;background:#17232d;color:#e8f1fa;font:16px Arial,sans-serif;--primary-text-color:#e8f1fa;--secondary-text-color:#a9bacb;--card-background-color:#202e3c;--ha-card-background:#202e3c;--divider-color:#40505c;--primary-background-color:#17232d;--primary-color:#23c5bd}body{padding:14px;box-sizing:border-box}sigen-hybrid-card{display:block;width:100%}</style>
<sigen-hybrid-card></sigen-hybrid-card>
<script type="module">
// Reproducible public documentation examples. This page has no credentials or network control client.
import '../custom_components/sigen_hybrid/frontend/sigen-hybrid-card.js';
const params=new URLSearchParams(location.search),card=document.querySelector('sigen-hybrid-card'),now=Date.now(),entities={},states={};
const measurements={solar_power:[4.82,'kW'],home_power:[1.74,'kW'],grid_power:[-.86,'kW'],battery_power:[2.22,'kW'],battery_soc:[68.4,'%'],battery_capacity:[36.16,'kWh'],solar_today:[24.03,'kWh'],home_today:[19.64,'kWh'],grid_import_today:[8.42,'kWh'],grid_export_today:[4.13,'kWh'],battery_charge_today:[16.48,'kWh'],battery_discharge_today:[6.1,'kWh'],forecast_today:[29.6,'kWh'],forecast_tomorrow:[25.3,'kWh'],ac_power:[0,'kW'],ac_today:[0,'kWh']};
for(const [key,[value,unit]] of Object.entries(measurements)){const id='sensor.example_'+key;entities[key]=id;states[id]={entity_id:id,state:String(value),last_updated:new Date(now).toISOString(),attributes:{unit_of_measurement:unit}};}
for(const [key,value,attributes] of [['control_status','ready',{config_entry_id:'example',control_api_version:1,live_writes_locked:true,connections:{modbus:{enabled:true,status:'connected'},cloud:{enabled:true,status:'connected'}},capabilities:{manual_control:{supported:true,available:false}},native_settings:{mode:{operationMode:0},gateway:{onOffGridStatus:0}}}],['cloud_mode','Sigen AI Mode',{}],['cloud_status','connected',{device_inventory:[{id:'solar',type:'solar',installed:true},{id:'storage',type:'inverter',installed:true},{id:'ac',type:'ac',installed:true},{id:'dc',type:'dc',installed:false}]}],['modbus_status','connected',{}],['forecast_status','ready',{available:true,provider:'average',sources:[{provider:'forecast_solar',name:'Forecast.Solar',available:true},{provider:'open_meteo_solar_forecast',name:'Open-Meteo',available:true}]}]]){const id='sensor.example_'+key;entities[key]=id;states[id]={entity_id:id,state:value,attributes,last_updated:new Date(now).toISOString()};}
entities.grid_status='sensor.example_grid_status';states[entities.grid_status]={state:'on_grid',attributes:{}};
states['weather.example']={state:'partlycloudy',attributes:{temperature:14.8,temperature_unit:'°C'}};states['sun.sun']={state:'above_horizon',attributes:{}};
card.setConfig({type:'custom:sigen-hybrid-card',title:'My SigenStor',view:params.get('view')??'overview',main_display:'photo',appearance:'day',config_entry:'example',entities,weather_entity:'weather.example',animations:false,devices:states[entities.cloud_status].attributes.device_inventory});
card.hass={states,themes:{darkMode:true},config:{time_zone:'Europe/Dublin',currency:'EUR',unit_system:{temperature:'°C'}},locale:{language:'en',number_format:'language'},user:{is_admin:true},callWS:async()=>{throw Error('Offline documentation example');}};
card._history=Object.fromEntries(Object.entries(entities).map(([key,id])=>[id,Array.from({length:144},(_,index)=>{const date=new Date();date.setHours(0,index*10,0,0);return {start:date.getTime(),mean:key==='battery_soc'?30+40*Math.sin(Math.PI*index/144)**2:key==='grid_power'?Math.sin(index/8):key==='battery_power'?2*Math.cos(index/12):key==='home_power'?1.6+.5*Math.sin(index/5):key==='solar_power'?Math.max(0,5*Math.sin(Math.PI*(index-36)/72)):0};})]));
card._config.recorded_history=card._history;
states[entities.forecast_today].attributes={available:true,series:card._history[entities.solar_power].map(row=>({start:new Date(row.start).toISOString(),end:new Date(row.start+600000).toISOString(),power_kw:row.mean*1.06}))};
card._render();window.galleryReady=true;
</script></html>
