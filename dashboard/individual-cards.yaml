# Copy individual card blocks into your desired dashboard sections.
# Configure the same integration entry on each card in the visual editor.
type: grid
columns: 2
square: false
cards:
  - type: custom:sigen-hybrid-card
    view: battery
    title: Battery
  - type: custom:sigen-hybrid-card
    view: solar
    title: Solar
  - type: custom:sigen-hybrid-card
    view: grid
    title: Grid
  - type: custom:sigen-hybrid-card
    view: forecast
    title: Forecast
